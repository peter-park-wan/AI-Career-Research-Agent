services:
  api:
    build: .
    image: ai-career-research-agent:latest
    container_name: ai-career-research-agent
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:-}
      - API_CORS_ORIGINS=${API_CORS_ORIGINS:-*}
    volumes:
      # 挂载简历/知识库目录，便于不重建镜像更新资料
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
