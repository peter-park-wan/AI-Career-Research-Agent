services:
  langgraph-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-career-research-agent:latest
    container_name: ai-career-research-agent
    ports:
      - "2024:2024"   # langgraph dev / Studio 界面端口
    environment:
      # LLM 提供方 API Key（演示真实调用时填写；不填则仅能启动、接口会报缺 Key）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # langgraph dev 端口
      - LANGGRAPH_PORT=2024
    volumes:
      # 持久化可写数据（简历 / 知识库）。如需 RAG，把索引放宿主 ./data/rag_index
      - ./data:/app/data
    restart: unless-stopped
